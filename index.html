<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Attendance AI</title>
<style>body{font-family:Arial;margin:0;background:#f3f6fa;padding:24px;color:#162238}.card{background:white;padding:20px;margin:15px auto;max-width:900px;border-radius:14px}button{padding:10px;margin:4px}video{width:100%;max-width:700px}</style></head>
<body><div class="card"><h1>Smart Attendance AI</h1><input id="name" placeholder="Student full name"><button onclick="start()">Start Camera</button><button onclick="enroll()">Enroll</button><button onclick="recognize()">Recognize & Mark Attendance</button><p id="msg"></p><video id="v" autoplay playsinline></video></div>
<div class="card"><h2>Attendance</h2><table id="t"></table></div>
<script>let s=null,v=document.getElementById('v');async function start(){s=await navigator.mediaDevices.getUserMedia({video:true,audio:false});v.srcObject=s}function shot(){return new Promise(r=>{let c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);c.toBlob(r,'image/jpeg',.88)})}async function enroll(){let f=new FormData();f.append('name',name.value);f.append('image',await shot(),'face.jpg');let x=await(await fetch('/api/enroll',{method:'POST',body:f})).json();msg.textContent=x.message||x.error}async function recognize(){let f=new FormData();f.append('image',await shot(),'frame.jpg');let x=await(await fetch('/api/recognize',{method:'POST',body:f})).json();msg.textContent=x.match?`✓ ${x.name} — ${x.score}% — Phone: ${x.phone.detected?'Detected':'No'}`:(x.message||x.error||'Unknown');load()}async function load(){let a=await(await fetch('/api/attendance')).json();t.innerHTML='<tr><th>Name</th><th>Time</th><th>Status</th><th>Score</th><th>Phone</th></tr>'+a.map(x=>`<tr><td>${x.name}</td><td>${x.timestamp}</td><td>${x.status}</td><td>${x.score||0}%</td><td>${x.phone_detected?'Detected':'No'}</td></tr>`).join('')}load()</script></body></html>
